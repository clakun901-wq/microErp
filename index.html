<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Micro-ERP</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header>
  <b id="brand"></b>
  <nav><button data-v="produk">Produk</button><button data-v="pesanan">Pesanan</button><button data-v="dasbor">Dasbor</button></nav>
  <span id="status"></span>
</header>
<div id="bar">
  <input id="q" type="search" placeholder="Cari nama / SKU…" autocomplete="off">
  <label><input id="low" type="checkbox"> Perlu restok</label>
  <select id="channel"><option>Shopee</option><option>Tokopedia</option><option>TikTok Shop</option><option>Manual</option></select>
  <span id="count"></span>
  <button id="backup">Cadangkan</button>
</div>
<main>
  <section id="v-produk"><virtual-list></virtual-list></section>
  <section id="v-pesanan" hidden></section>
  <section id="v-dasbor" hidden></section>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>

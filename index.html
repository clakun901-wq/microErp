<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Micro-ERP</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header><b id="brand"></b><span id="status"></span><button id="gear" class="ghost" aria-label="Pengaturan">⚙ Pengaturan</button></header>
<div id="banner" hidden><span>Anda memakai <b>data contoh</b>.</span><button id="clearDemo" class="ghost">Hapus data contoh</button></div>
<main>
  <section id="v-welcome" hidden></section>
  <section id="v-beranda"></section>
  <section id="v-stok" hidden>
    <div id="bar">
      <input id="q" type="search" placeholder="Cari produk atau SKU…" autocomplete="off">
      <button id="add">+ Produk</button>
      <label><input id="low" type="checkbox"> Hanya yang hampir habis</label>
      <span id="count"></span>
    </div>
    <div id="listwrap"><virtual-list></virtual-list></div>
  </section>
  <section id="v-pesanan" hidden></section>
  <section id="v-keuangan" hidden></section>
</main>
<nav id="tabs">
  <button data-v="beranda">🏠<span>Beranda</span></button><button data-v="stok">📦<span>Stok</span></button>
  <button data-v="pesanan">🧾<span>Pesanan</span></button><button data-v="keuangan">💰<span>Keuangan</span></button>
</nav>
<div id="toast" role="status"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
